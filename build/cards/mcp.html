<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&family=Noto+Sans+JP:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="card.css">
<style>
/* 1200x960, not 1200x800: this one fills the image half of the page's
   featured card, which sits close to 5:4 on desktop. */
body{height:960px;background:#D97757}
/* The request is the ChatGPT starter prompt the plugin is published with;
   the pages are the samples tex64.com/mcp publishes for that request. */
.ask{position:absolute;left:110px;top:92px;max-width:620px;padding:24px 30px;
     background:#FAF9F5;border-radius:26px 26px 26px 6px;
     font:500 27px/1.6 'Noto Sans JP',sans-serif;color:#141413;
     box-shadow:0 18px 40px rgba(20,20,19,.16)}
.ask b{font:500 25px 'Geist Mono',monospace;color:#A94F2E;margin-right:.4em}
.paper{width:380px;top:330px}
.paper img{width:100%}
.p0{left:80px;top:380px;transform:rotate(-8deg)}
.p1{left:450px;transform:rotate(-2deg)}
.p2{left:750px;top:300px;transform:rotate(5deg)}
</style></head>
<body>
<div class="paper p0"><img src="../assets/mcp/sample-cover.png" alt=""></div>
<div class="paper p2"><img src="../assets/mcp/sample-exercise.png" alt=""></div>
<div class="paper p1"><img src="../assets/mcp/sample-body.png" alt=""></div>
<div class="ask"><b>@TeX64</b>熱力学第一法則について、B5の日本語学習ノートを作ってPDFにして</div>
</body></html>
